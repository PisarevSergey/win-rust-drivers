[package]
name = "central_lib"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true

[dependencies]
sysmon_common = { version = "0.1.0", path = "../sysmon_common" }
win = { version = "0.1.0", path = "../../win", features = ["fltkernel"] }
